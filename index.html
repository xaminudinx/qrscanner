<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <script src="html5-qrcode.min.js"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Mengatur konten berada di bagian atas */
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .container {
            text-align: center;
            margin-top: 20px; /* Tambahkan sedikit margin dari atas */
        }

        /* Gaya untuk animasi loading */
        #loading {
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .loader {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #reader {
            width: 300px;
            height: 300px; 
            max-height: 80vh;
            overflow: hidden;
            margin: 0 auto;
        }

        #upload-button,
        .btn {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50; /* Green */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.3s;
            text-decoration: none;
            text-align: center;
        }

        #upload-button:hover,
        .btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #upload-button:active,
        .btn:active {
            background-color: #3e8e41;
        }

        #upload-button:focus,
        .btn:focus {
            outline: none;
        }

        #scan-result {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SCAN QR CODE</h1>

        <!-- Pindahkan elemen loading ke sini -->
        <div id="loading" style="display: none;">
            <div class="loader"></div>
        </div>

        <div id="reader"></div>
        <p id="scan-result"></p>
        <button id="upload-button">Upload Kode QR</button>
        <!--a class="btn" href="intenthttps://192.168.2.2/qrscanner#Intent;scheme=http;package=com.android.chrome;end"> Open in Chrome</a-->
        <input type="file" id="qr-input-file" accept="image/*" style="display:none;">
    </div>
