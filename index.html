<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <script src="html5-qrcode.min.js"></script>

    <style>
        #loading {
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .loader {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #reader {
            width: 300px;
            height: 300px;
            max-height: 80vh;
            overflow: hidden;
        }

        button {
            margin: 5px;
            padding: 8px 18px;
            border-radius: 6px;
            border: none;
            background: #198754;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        #upload-button {
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <center>
        <h1>SCAN QR CODE</h1>

        <div id="loading" style="display:none;">
            <div class="loader"></div>
        </div>

        <div id="reader"></div>
        <p id="scan-result"></p>

        <div>
            <!-- UPLOAD GAMBAR -->
        <button id="upload-button">Upload Kode QR</button>
        <input type="file" id="qr-input-file" accept="image/*" style="display:none;">
            <!-- TOMBOL KAMERA -->
            <button id="reloadBtn">Ganti Kamera</button>
        </div>
