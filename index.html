<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Scanner</title>
<script src="html5-qrcode.min.js"></script>

<style>
    #loading { width:100%; height:100%; background: rgba(255,255,255,0.8); display:flex; justify-content:center; align-items:center; margin-top:10px; }
    .loader { border: 8px solid #f3f3f3; border-radius:50%; border-top:8px solid #3498db; width:50px; height:50px; animation:spin 1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

    #reader { width:70vw; height:40vh; max-height:80vh; overflow:hidden; margin-bottom:10px; border-radius:10px; }

    button { padding:10px 20px; margin:5px; font-size:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; color:white; background:#3498db; transition:.25s; }
    button:hover { background:#2d85c9; transform:scale(1.05); }
    button:active { background:#246fa8; }

    #upload-button { background:#4CAF50; }
    #upload-button:hover { background:#449d48; }

    #switch-button { background:#d35400; }
    #switch-button:hover { background:#b84700; }

    #https-warning {
        display:none;
        width:90%;
        background:#ff4444;
        color:white;
        padding:10px;
        border-radius:8px;
        margin:10px auto;
        font-weight:bold;
        text-align:center;
    }
    #https-ok-btn { background:white; color:#ff4444; font-weight:bold; border:none; padding:8px 20px; border-radius:6px; cursor:pointer; }
</style>
</head>
