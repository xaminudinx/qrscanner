<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <script src="html5-qrcode.min.js"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .container {
            text-align: center;
            margin-top: 20px;
        }

        #loading {
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .loader {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #reader {
            width: 300px;
            height: 300px;
            max-height: 80vh;
            overflow: hidden;
            margin: 0 auto;
        }

        #upload-button,
        .btn {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.3s;
            text-decoration: none;
            text-align: center;
        }

        #upload-button:hover,
        .btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #upload-button:active,
        .btn:active {
            background-color: #3e8e41;
        }

        #upload-button:focus,
        .btn:focus {
            outline: none;
        }

        #scan-result {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SCAN QR CODE</h1>

        <div id="loading" style="display: none;">
            <div class="loader"></div>
        </div>

        <div id="reader"></div>
        <p id="scan-result"></p>
        <button id="upload-button">Upload Kode QR</button>
        <input type="file" id="qr-input-file" accept="image/*" style="display:none;">
    </div>

 	<script>
        // === Paksa HTTPS jika sedang HTTP ===
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            location.replace('https://' + location.hostname + location.pathname + location.search + location.hash);
        }

		var userAgent = navigator.userAgent || navigator.vendor || window.opera;

		function isWebView() {
			var isAndroidWebView = /android/i.test(userAgent) && userAgent.indexOf('wv') > -1;
			var isIOSWebView = /(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(userAgent);
			return isAndroidWebView || isIOSWebView;
		}

		function openInBrowser() {
			if (/android/i.test(userAgent)) {
				window.location.href = "intent://xaminudinx.github.io/qrscanner#Intent;scheme=https;package=com.android.chrome;end";
			} else if (/(iPhone|iPod|iPad)/i.test(userAgent)) {
				alert('Please open this page in Safari for better performance.');
				window.location.href = "https://xaminudinx.github.io/qrscanner";
			}
		}

		if (isWebView()) {
			openInBrowser();
		}

		let html5QrCode;
		let isUsingCamera = true;

		function showLoading() {
			document.getElementById("loading").style.display = "flex";
		}

		function hideLoading() {
			document.getElementById("loading").style.display = "none";
		}

		function processDecodedText(decodedText) {
			console.log(`Code scanned = ${decodedText}`);
			try {
				const urlParams = new URLSearchParams(new URL(decodedText).search);
				const username = urlParams.get('username');
				const password = urlParams.get('password');

				if (username && password) {
					if (username === password) {
						document.getElementById("scan-result").innerHTML = `Voucher = ${username}`;
					} else {
						document.getElementById("scan-result").innerHTML = `username=${username}<br>password=${password}`;
					}

					setTimeout(() => {
						window.location.href = decodedText;
					}, 1000);
				} else {
					document.getElementById("scan-result").textContent = `${decodedText} - Maaf, ini bukan QR code untuk login`;
					resetScanResult();
				}
			} catch (e) {
				document.getElementById("scan-result").textContent = `${decodedText} - Format QR tidak valid`;
				resetScanResult();
			}
		}

		function resetScanResult() {
			if (!isUsingCamera) {
				setTimeout(() => location.reload(), 2000);
			} else {
				setTimeout(() => {
					document.getElementById("scan-result").textContent = "";
				}, 2000);
			}
		}

		function onScanSuccess(decodedText, decodedResult) {
			processDecodedText(decodedText);
		}

		function onScanError(errorMessage) {
			console.error(errorMessage);
		}

		// === Pakai kamera belakang secara default (fix iPhone) ===
		html5QrCode = new Html5Qrcode("reader");
		showLoading();

		html5QrCode.start(
			{ facingMode: "environment" },
			{ fps: 10, qrbox: { width: 180, height: 250 } },
			onScanSuccess,
			onScanError
		).then(() => {
			hideLoading();
		}).catch(err => {
			console.warn("Gagal pakai facingMode environment, coba enumerasi kamera:", err);
			Html5Qrcode.getCameras().then(devices => {
				if (devices && devices.length) {
					const cameraId = devices[devices.length - 1].id;
					html5QrCode.start(
						cameraId,
						{ fps: 10, qrbox: { width: 180, height: 250 } },
						onScanSuccess,
						onScanError
					).then(() => hideLoading())
					.catch(err => {
						hideLoading();
						console.error("Error starting fallback camera:", err);
					});
				} else {
					hideLoading();
					alert("Tidak ada kamera yang terdeteksi.");
				}
			}).catch(err => {
				hideLoading();
				console.error("Error mendapatkan kamera:", err);
			});
		});

		// tombol upload
		setTimeout(() => {
			document.getElementById("upload-button").style.display = "inline";
		}, 2000);

		document.getElementById("upload-button").addEventListener("click", () => {
			isUsingCamera = false;
			document.getElementById("qr-input-file").click();
		});

		document.getElementById("qr-input-file").addEventListener("change", (event) => {
			if (event.target.files.length == 0) return;
			const file = event.target.files[0];
			if (html5QrCode) {
				html5QrCode.stop().then(() => {
					document.getElementById("reader").innerHTML = `<img src="${URL.createObjectURL(file)}" style="width:300px; height:300px;" id="uploaded-image"/>`;
					html5QrCode.scanFile(file, true)
						.then(decodedText => processDecodedText(decodedText))
						.catch(err => {
							console.error(`Error scanning file: ${err}`);
							document.getElementById("scan-result").textContent = "Gagal scan gambar, coba potong bagian QR-nya.";
							setTimeout(() => location.reload(), 2000);
						});
				});
			}
		});
	</script>
</body>
</html>
